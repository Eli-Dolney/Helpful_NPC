plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '0.9.0'
group = 'com.example.helpfulworkers'
base { archivesName = 'helpfulworkers' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.235'
    runs {
        client { client() }
        // Dev UI check: opens "New World" and screenshots every mod screen into run/screenshots (see UiShots).
        uiShots {
            client()
            systemProperty 'helpfulworkers.uishots', 'true'
            programArguments.addAll('--quickPlaySingleplayer', 'New World')
        }
        server { server() }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', 'helpfulworkers'
        }
    }
    mods { helpfulworkers { sourceSet sourceSets.main } }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('runServer') { standardInput = System.in }
